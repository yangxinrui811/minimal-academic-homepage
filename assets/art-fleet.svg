<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="Ten AI agents coordinated through a shared blackboard">
  <defs>
    <linearGradient id="gBus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2d5c"/><stop offset="1" stop-color="#1e6fd0"/>
    </linearGradient>
    <radialGradient id="gEd"><stop offset="0" stop-color="#9cd0ff"/><stop offset=".6" stop-color="#2f8dff"/><stop offset="1" stop-color="#0a5bb5"/></radialGradient>
  </defs>
  <!-- edges: workers -> bus -->
  <g stroke="#9cc2ee" stroke-width="1.4" stroke-dasharray="4 6" class="flowlines">
    <line x1="120" y1="150" x2="120" y2="240"/>
    <line x1="212" y1="118" x2="212" y2="240"/>
    <line x1="304" y1="96"  x2="304" y2="240"/>
    <line x1="396" y1="88"  x2="396" y2="240"/>
    <line x1="556" y1="88"  x2="556" y2="240"/>
    <line x1="648" y1="96"  x2="648" y2="240"/>
    <line x1="740" y1="118" x2="740" y2="240"/>
  </g>
  <!-- editor -> bus (solid) -->
  <line x1="476" y1="70" x2="476" y2="240" stroke="#0a5bb5" stroke-width="2.2"/>
  <!-- bus -->
  <rect x="80" y="240" width="700" height="42" rx="21" fill="url(#gBus)" opacity=".92"/>
  <text x="430" y="266" text-anchor="middle" font-family="inherit" font-size="12.5" letter-spacing="3" fill="#cfe3ff">SHARED BLACKBOARD · GIT-AUDITED</text>
  <!-- worker nodes -->
  <g>
    <circle cx="120" cy="150" r="10" fill="#fff" stroke="#0a5bb5" stroke-width="2.2"/>
    <circle cx="212" cy="118" r="10" fill="#e8f2ff" stroke="#0a5bb5" stroke-width="2.2"/>
    <circle cx="304" cy="96"  r="10" fill="#fff" stroke="#0a5bb5" stroke-width="2.2"/>
    <circle cx="396" cy="88"  r="10" fill="#e8f2ff" stroke="#0a5bb5" stroke-width="2.2"/>
    <circle cx="556" cy="88"  r="10" fill="#fff" stroke="#0a5bb5" stroke-width="2.2"/>
    <circle cx="648" cy="96"  r="10" fill="#e8f2ff" stroke="#0a5bb5" stroke-width="2.2"/>
    <circle cx="740" cy="118" r="10" fill="#fff" stroke="#0a5bb5" stroke-width="2.2"/>
  </g>
  <!-- editor node -->
  <circle cx="476" cy="70" r="17" fill="url(#gEd)"/>
  <circle cx="476" cy="70" r="24" fill="none" stroke="#0a5bb5" stroke-width="1" opacity=".35"/>
  <text x="476" y="38" text-anchor="middle" font-family="inherit" font-size="11.5" letter-spacing="2" fill="#0a5bb5" font-weight="700">EDITOR</text>
  <!-- moving packets -->
  <circle r="3.2" fill="#7b4dff">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 304 96 L 304 240"/>
  </circle>
  <circle r="2.8" fill="#2f8dff">
    <animateMotion dur="4.1s" repeatCount="indefinite" path="M 648 240 L 648 96"/>
  </circle>
  <circle r="2.8" fill="#2f8dff">
    <animateMotion dur="3.7s" begin="1.2s" repeatCount="indefinite" path="M 212 118 L 212 240"/>
  </circle>
</svg>
